# =========================================================
# Atlas Enterprise OS — CI
#
# Every job is blocking:
#   web  — typecheck, lint, unit tests, production build,
#          then the HTTP end-to-end suite against that build
#   db   — migrations 0001–0007 + full RLS/RBAC matrix on a
#          real Postgres with pgvector
#   docker — validates apps/web/Dockerfile
# =========================================================

name: CI

on:
  push:
    # main plus the Freebuff working branches, so a pushed
    # feature branch is validated without needing a PR first.
    branches:
      - main
      - "freebuff/**"
  pull_request:

jobs:
  web:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        # Built WITHOUT placeholder env on purpose: NEXT_PUBLIC_*
        # values are inlined at build time, and the e2e suite boots
        # the server with controlled runtime credentials (including a
        # deliberately unconfigured server). Building with values here
        # would bake them in and make that phase meaningless.
        # A build that receives real build args is covered by the
        # `docker build` job.
        run: npm run build

      - name: End-to-end (HTTP against the production build)
        run: npm run test:e2e

  db:
    name: migrations + RLS (Postgres/pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Database integration suite
        run: npm run test:db
        env:
          ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas
          ATLAS_TEST_REQUIRE_VECTOR: "1"

      # Regression guard: the pgvector-less path must still apply
      # every later migration. This run previously aborted with
      # `relation "public.document_chunks" does not exist`
      # (0005 referenced a table 0002 did not create).
      - name: Database suite without pgvector (embedded)
        run: npm run test:db

  docker:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: >-
          docker build ./apps/web
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-key
          --build-arg GEMINI_API_KEY=placeholder-key
          --tag atlas-web:ci
