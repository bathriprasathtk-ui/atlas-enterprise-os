# =========================================================
# Atlas Enterprise OS — CI
#
# Every job is blocking:
#   web  — typecheck, lint, unit tests, production build,
#          then the HTTP end-to-end suite against that build
#   db   — migrations 0001–0007 + full RLS/RBAC matrix on a
#          real Postgres with pgvector
#   docker — validates apps/web/Dockerfile
# =========================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholders only — real values live in repo secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
          GEMINI_API_KEY: placeholder-key

      - name: End-to-end (HTTP against the production build)
        run: npm run test:e2e

  db:
    name: migrations + RLS (Postgres/pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Database integration suite
        run: npm run test:db
        env:
          ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas
          ATLAS_TEST_REQUIRE_VECTOR: "1"

  docker:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: >-
          docker build ./apps/web
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-key
          --build-arg GEMINI_API_KEY=placeholder-key
          --tag atlas-web:ci
